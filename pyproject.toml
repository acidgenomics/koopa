[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "koopa"
version = "0.27.0"
description = "Shell bootloader for data science."
readme = "README.md"
keywords = [ "bioinformatics", "data science", "fair data", "ngs", "shell" ]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
authors = [ { name = "Michael Steinbaugh", email = "mike@steinbaugh.com" } ]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
optional-dependencies.docs = [
  "myst-parser",
  "sphinx",
]
optional-dependencies.extra = [
  "syntactic>=0.1",
  "tqdm",
]
scripts.koopa = "koopa.cli_main:main"

[tool.setuptools]
packages.find.where = [ "lang/python/src" ]

[tool.uv]
sources.syntactic = { index = "acidgenomics" }
index = [ { name = "acidgenomics", url = "https://python.acidgenomics.com/simple/" } ]

[tool.ruff]
# Deliberately below requires-python. koopa's runtime needs 3.14, but the
# source must stay parseable AND importable on the floor: `koopa update` is
# the only path that installs a new interpreter, and it runs under the OLD
# one. Raising this floor bricks every host still on an older Python.
target-version = "py312"
line-length = 100
indent-width = 4
format.quote-style = "double"
format.docstring-code-line-length = 72
format.docstring-code-format = true
lint.select = [
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C90",  # mccabe
  "D",    # pydocstyle
  "E",    # pycodestyle
  "F",    # PyFlakes
  "FIX",  # flake8-fixme
  "I",    # isort
  "N",    # pep8-naming
  "NPY",  # NumPy-specific rules,
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "SLOT", # flake8-slots
  "UP",   # pyupgrade
  "W",    # pycodestyle
]
# List of rules: https://docs.astral.sh/ruff/rules/
lint.ignore = [
  "D203",    # one-blank-line-before-class
  "D213",    # multi-line-summary-second-line
  "D401",    # non-imperative-mood
  "PLC0415", # import-outside-top-level
]
lint.per-file-ignores."lang/python/src/koopa/cli_app.py" = [ "PLC0415" ]
lint.per-file-ignores."lang/python/src/koopa/cli_bin.py" = [ "PLC0415" ]
lint.per-file-ignores."lang/python/src/koopa/cli_develop.py" = [ "PLC0415" ]
lint.per-file-ignores."lang/python/src/koopa/cli_internal.py" = [ "PLC0415" ]
lint.per-file-ignores."lang/python/src/koopa/cli_main.py" = [ "PLC0415" ]
lint.per-file-ignores."lang/python/src/koopa/cli_system.py" = [ "PLC0415" ]
lint.isort.extra-standard-library = [ "typing" ]
lint.isort.known-first-party = []
lint.isort.order-by-type = true
lint.isort.relative-imports-order = "closest-to-furthest"
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
lint.mccabe.max-complexity = 30
lint.pycodestyle.max-doc-length = 100
lint.pydocstyle.convention = "numpy"
lint.pylint.allow-magic-value-types = [ "bytes", "float", "int", "str" ]
lint.pylint.max-args = 30
lint.pylint.max-branches = 30
lint.pylint.max-positional-args = 30
lint.pylint.max-statements = 100

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-init-module = true
ignore-property-decorators = false
ignore-setters = false
verbose = 2

[tool.pyright]
pythonVersion = "3.14"
include = [ "lang/python" ]
extraPaths = [ "opt/pytest/libexec/lib/python3.14/site-packages" ]
reportMissingModuleSource = "error"
verboseOutput = true

[tool.ty]
environment.extra-paths = [ "opt/pytest/libexec/lib/python3.14/site-packages" ]
terminal.error-on-warning = true

[tool.pytest]
ini_options.testpaths = [ "lang/python/tests" ]
ini_options.pythonpath = [ "lang/python/src" ]

[tool.coverage]
run.relative_files = true
run.source = [ "lang/python/src" ]

[tool.bumpver]
commit = true
commit_message = "Bump version to {new_version}."
current_version = "v0.27.0"
push = false
tag = false
tag_message = "{new_version}"
tag_scope = "default"
version_pattern = "vMAJOR.MINOR.PATCH"
file_patterns."pyproject.toml" = [
  'current_version = "{version}"',
  'version = "{pep440_version}"',
]
file_patterns.".claude-plugin/marketplace.json" = [ '"version": "{pep440_version}"' ]
file_patterns."plugins/koopa/.claude-plugin/plugin.json" = [ '"version": "{pep440_version}"' ]
file_patterns."plugins/koopa/.github/plugin/plugin.json" = [ '"version": "{pep440_version}"' ]

[tool.numpydoc_validation]
checks = [
  "all",  # report on all checks, except
  "GL01", # do not require docstring formatting that conflicts with ruff
  "GL02", # ...
  "GL03", # ...
  "GL08", # nor require __init__ docstrings (params documented in class docstring)
  "ES01", # nor require an extended summary
  "EX01", # nor examples
  "PR02", # nor require parameter docs for dataclasses (fields are self-documenting)
  "SA01", # nor a see also section
  "SS06", # nor require the summary to fit on one line
]
# Allow docstrings to start with these words.
override_SS05 = [ "^Access ", "^Assess ", "^Process " ]
