# Draft recipe for conda-forge/staged-recipes. NOT submitted anywhere yet.
#
# Package name is "koopa". Note: an unrelated, more domain-appropriate
# project (https://github.com/bbquercus/koopa, cellular microscopy) holds
# the bare name "koopa" on PyPI. This does not block using "koopa" here --
# conda-forge does not share PyPI's namespace, and PyPI publication is not
# planned for this package -- but it was a deliberate call, not an
# oversight: someone searching conda-forge for the microscopy tool will
# find this package instead. See the plan at
# .claude/plans/can-you-help-me-serialized-anchor.md for the full rationale.
#
# Prerequisites (see plan, steps 1-4) landed in this same change:
#   - koopa_prefix() honors KOOPA_PREFIX, falls back to sys.prefix when no
#     git-checkout data tree is found alongside the installed package.
#   - koopa_version() reads installed package metadata when no
#     pyproject.toml is present.
#   - App install/reinstall/uninstall/update refuse cleanly on a non-git
#     (packaged) install, per _require_git_managed_install() in cli_main.py.
#   - "Private :: Do Not Upload" classifier removed from pyproject.toml.
#
# NOT yet done, and required before this can actually build:
#   - build.sh below assumes conda-build unpacks the release tarball as-is
#     and that `pip install --no-deps .` plus copying etc/koopa/app.json and
#     share/ into $PREFIX is sufficient. This has been smoke-tested manually
#     against a local venv (see plan verification section) but never through
#     an actual conda-build/rattler-build run.
#   - No CI-friendly test beyond `koopa --version` / `import koopa` has been
#     written; koopa list (exercises app.json) would be a stronger test but
#     requires the data-file copy step to have run first.

{% set version = "0.23.0" %}
{% set github = "https://github.com/acidgenomics/koopa" %}

package:
  name: koopa
  version: "{{ version }}"

source:
  url: "{{ github }}/archive/v{{ version }}.tar.gz"
  sha256: 05d661b0f3bbe789ba5048bdeaa770790fb233c65ddcbaaf5e1248f8b1fde4cb

build:
  number: 0
  noarch: python
  script: build.sh
  entry_points:
    - koopa = koopa.cli_main:main

requirements:
  host:
    - python 3.12.*
    - pip
    - setuptools
  run:
    - python 3.12.*
    # koopa's mandatory dependency set is empty; tqdm and syntactic are
    # optional ([project.optional-dependencies] "extra") and out of scope
    # for this read-only CLI subset. syntactic is unavailable outside
    # python.acidgenomics.com and must stay excluded regardless.

test:
  imports:
    - koopa
  commands:
    - koopa --version
    - koopa list

about:
  home: https://koopa.acidgenomics.com/
  dev_url: "{{ github }}"
  summary: Shell bootloader for data science (read-only CLI subset; app management requires the native installer)
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - acidgenomics
    - mjsteinbaugh
